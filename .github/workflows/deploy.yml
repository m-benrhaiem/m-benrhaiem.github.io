name: Déploiement sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; un déploiement en cours n'est jamais interrompu.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Installer les dépendances
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # Fournit le chemin de base du site : "" pour m-benrhaiem.github.io ou un domaine
      # personnalisé, "/nom-du-depot" pour un autre dépôt.
      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Compiler le site Angular
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npx ng build --configuration production --base-href "${BASE_PATH}/"

      # Charge le build dans Chrome (préinstallé sur le runner) : rendu, animations, liens, erreurs.
      # En cas d'échec, rien n'est déployé et le site en ligne reste sur la version précédente.
      - name: Tester le site dans Chrome (test de fumée)
        run: npm run test:smoke

      - name: Préparer l'artefact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v5
